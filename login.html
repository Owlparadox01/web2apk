<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fxhl Web2Apk V1 — Convert websites and projects into native Android APK files instantly.">
  <title>Login — Fxhl Web2Apk V1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.6);
      --bg-card-hover: rgba(17, 24, 39, 0.8);
      /* Warna resmi Telegram: primary = gradient #2AABEE -> #229ED9 */
      --border-subtle: rgba(42, 171, 238, 0.18);
      --border-active: rgba(42, 171, 238, 0.55);
      --accent-primary: #2AABEE;
      --accent-secondary: #229ED9;
      --accent-glow: rgba(42, 171, 238, 0.28);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --success: #31B545;
      --error: #E53935;
      --error-bg: rgba(229, 57, 53, 0.1);
      --info-bg: rgba(99, 102, 241, 0.08);
      --info-border: rgba(99, 102, 241, 0.2);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(99, 102, 241, 0.08);
      --shadow-button: 0 4px 16px rgba(99, 102, 241, 0.3);
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated Background ── */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }

    .bg-gradient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      z-index: 0;
      animation: orbFloat 20s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--accent-primary), transparent 70%);
      top: -100px;
      right: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--accent-secondary), transparent 70%);
      bottom: -80px;
      left: -80px;
      animation-delay: -10s;
    }

    .orb-3 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #06b6d4, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -5s;
      opacity: 0.2;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -20px) scale(1.05); }
      50% { transform: translate(-20px, 30px) scale(0.95); }
      75% { transform: translate(20px, 20px) scale(1.02); }
    }

    /* ── Particle Canvas ── */
    #particleCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Login Container ── */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      animation: fadeInUp 0.8s var(--transition-slow) forwards;
      opacity: 0;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 48px 40px 40px;
      box-shadow: var(--shadow-card);
      transition: border-color var(--transition-normal);
    }

    .login-card:hover {
      border-color: var(--border-active);
    }

    /* ── Logo ── */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 0 8px var(--accent-glow)); }
      50% { filter: drop-shadow(0 0 20px var(--accent-glow)); }
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .logo-text span {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-version {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Heading ── */
    .login-heading {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-heading h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* ── Error Box ── */
    .error-box {
      background: var(--error-bg);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: shakeIn 0.4s ease;
    }

    .error-box.show {
      display: flex;
    }

    .error-box svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    @keyframes shakeIn {
      0% { transform: translateX(-8px); opacity: 0; }
      25% { transform: translateX(6px); }
      50% { transform: translateX(-4px); }
      75% { transform: translateX(2px); }
      100% { transform: translateX(0); opacity: 1; }
    }

    /* ── Loading ── */
    .loading-indicator {
      display: none;
      justify-content: center;
      margin-bottom: 20px;
    }

    .loading-indicator.show {
      display: flex;
    }

    .spinner-ring {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spinRotate 0.8s linear infinite;
    }

    @keyframes spinRotate {
      to { transform: rotate(360deg); }
    }

    /* ── Form ── */
    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      transition: color var(--transition-fast);
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(99, 102, 241, 0.12);
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all var(--transition-fast);
      outline: none;
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 400;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-primary);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-wrapper input:focus ~ svg,
    .input-wrapper input:focus + svg {
      color: var(--accent-primary);
    }

    /* ── Button ── */
    .btn-login {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-button);
    }

    .btn-login:hover::before {
      transform: translateX(100%);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* ── Info Box ── */
    .info-box {
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-top: 24px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .info-box svg {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      color: var(--accent-primary);
      margin-top: 2px;
    }

    .info-box b {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* ── Footer ── */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card {
        padding: 36px 24px 28px;
        border-radius: var(--radius-lg);
      }

      .logo-icon {
        width: 52px;
        height: 52px;
      }

      .logo-text {
        font-size: 19px;
      }
    }

    @media (min-width: 1600px) {
      html {
        font-size: 17px;
      }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #f0f2f7;
        --bg-secondary: #ffffff;
        --bg-card: rgba(255, 255, 255, 0.85);
        --bg-card-hover: rgba(255, 255, 255, 0.95);
        --border-subtle: rgba(42, 171, 238, 0.14);
        --border-active: rgba(42, 171, 238, 0.4);
        --text-primary: #1e293b;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(42, 171, 238, 0.05);
        --error-bg: rgba(229, 57, 53, 0.06);
        --info-bg: rgba(42, 171, 238, 0.06);
      }

      .error-box {
        color: var(--error);
      }

      .input-wrapper input {
        background: rgba(241, 245, 249, 0.8);
      }

      .input-wrapper input:focus {
        background: rgba(255, 255, 255, 0.9);
      }
    }
  </style>
</head>
<body>

  <!-- Background Effects -->
  <div class="bg-grid"></div>
  <div class="bg-gradient-orb orb-1"></div>
  <div class="bg-gradient-orb orb-2"></div>
  <div class="bg-gradient-orb orb-3"></div>
  <canvas id="particleCanvas"></canvas>

  <!-- Login Card -->
  <div class="login-wrapper">
    <div class="login-card">
      <!-- SVG Logo -->
      <div class="logo-container">
        <svg class="logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer shield shape -->
          <path d="M32 4L8 16v16c0 14.4 10.24 27.84 24 32 13.76-4.16 24-17.6 24-32V16L32 4z" fill="url(#shield-gradient)" opacity="0.15"/>
          <path d="M32 4L8 16v16c0 14.4 10.24 27.84 24 32 13.76-4.16 24-17.6 24-32V16L32 4z" stroke="url(#shield-stroke)" stroke-width="1.5" fill="none"/>
          <!-- Inner rocket / arrow icon -->
          <path d="M32 18l-8 12h5v10h6V30h5L32 18z" fill="url(#arrow-gradient)"/>
          <!-- Converting dots -->
          <circle cx="22" cy="44" r="2" fill="#6366f1" opacity="0.6">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="32" cy="48" r="2" fill="#8b5cf6" opacity="0.8">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="42" cy="44" r="2" fill="#a78bfa" opacity="0.6">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/>
          </circle>
          <defs>
            <linearGradient id="shield-gradient" x1="8" y1="4" x2="56" y2="64">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
            <linearGradient id="shield-stroke" x1="8" y1="4" x2="56" y2="64">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
            <linearGradient id="arrow-gradient" x1="24" y1="18" x2="40" y2="40">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="logo-text">Web2<span>Apk</span></div>
        <div class="logo-version">V2 &middot; Gen 1</div>
      </div>

      <!-- Title -->
      <div class="login-heading">
        <h1>Masuk dengan Access Key</h1>
      </div>
      <p class="login-subtitle">Masukkan key yang diberikan melalui Telegram Bot</p>

      <!-- Error -->
      <div class="error-box" id="error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorText"></span>
      </div>

      <!-- Loading -->
      <div class="loading-indicator" id="loading">
        <div class="spinner-ring"></div>
      </div>

      <!-- Form -->
      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <label for="key">Access Key</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="key"
              name="key"
              placeholder="XXXXXXXXXXXXXXXX"
              maxlength="16"
              autocomplete="off"
              spellcheck="false"
              required
            >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            </svg>
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn-login">Masuk</button>
      </form>

      <!-- Info -->
      <div class="info-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>Key didapat dari command <b>/addakses</b> di Telegram Bot</span>
      </div>

      <div class="login-footer">&copy; 2026 Web2Apk V1 &middot; All rights reserved</div>
    </div>
  </div>

  <script>
    // ── Particle Background ──
    (function initParticles() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const PARTICLE_COUNT = 40;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function createParticle() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          size: Math.random() * 2 + 0.5,
          opacity: Math.random() * 0.3 + 0.1,
        };
      }

      function init() {
        resize();
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(createParticle());
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(99, 102, 241, ${p.opacity})`;
          ctx.fill();
        });

        // Draw connections
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(99, 102, 241, ${0.06 * (1 - dist / 150)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      init();
      draw();
    })();

    // ── Device ID ──
    function getDeviceId() {
      let deviceId = localStorage.getItem('deviceId');
      if (!deviceId) {
        deviceId = 'web-' + Math.random().toString(36).substring(2, 15);
        localStorage.setItem('deviceId', deviceId);
      }
      return deviceId;
    }

    // ── Check Session ──
    async function checkSession() {
      const key = localStorage.getItem('accessKey');
      const deviceId = getDeviceId();

      if (!key) return;

      try {
        const response = await fetch(`/api/auth/verify?key=${key}&deviceId=${deviceId}`);
        const data = await response.json();

        if (data.valid) {
          window.location.href = '/dashboard';
        } else {
          localStorage.removeItem('accessKey');
        }
      } catch (err) {
        console.error('Session check failed:', err);
      }
    }

    // ── Login Handler ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const key = document.getElementById('key').value.trim().toUpperCase();
      const deviceId = getDeviceId();
      const errorBox = document.getElementById('error');
      const errorText = document.getElementById('errorText');
      const loadingDiv = document.getElementById('loading');
      const submitBtn = document.getElementById('submitBtn');

      // Reset UI
      errorBox.classList.remove('show');
      loadingDiv.classList.add('show');
      submitBtn.disabled = true;

      try {
        const response = await const response = await fetch('http://129.212.230.12:2000/api/auth/login', {

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, deviceId })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('accessKey', key);
          localStorage.setItem('member', JSON.stringify(data.member));
          window.location.href = './dashboard.html';

        } else {
          errorText.textContent = data.error || 'Login gagal';
          errorBox.classList.add('show');
        }
      } catch (err) {
        errorText.textContent = 'Terjadi kesalahan. Coba lagi.';
        errorBox.classList.add('show');
        console.error('Login error:', err);
      } finally {
        loadingDiv.classList.remove('show');
        submitBtn.disabled = false;
      }
    });

    // Check session on load
    checkSession();
  </script>
</body>
</html>
